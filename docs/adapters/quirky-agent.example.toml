# 示例:带字段方言的声明式适配器(命令数组 + environment 键 + serverUrl)。
# 演示 command_style/env_key/url_key —— 适用于 mcp 字段形态偏离主流的 agent。
id = "quirky-agent"
displayName = "Quirky Agent"

[detect]
global = ["~/.quirky"]

[rules]
global = "~/.quirky/AGENTS.md"
project = "{dir}/AGENTS.md"
format = "markdown"

[mcp]
global = "~/.quirky/mcp.json"
project = "{dir}/.quirky/mcp.json"
format = "json"
servers_key = "mcp"
# command 形态:数组(首元为命令,其余为参数),如 opencode。
command_style = "array"
# env 字段名:environment,如 opencode。
env_key = "environment"
# remote url 字段名:serverUrl,如 windsurf。
url_key = "serverUrl"

capabilities = { rules = ["global", "project"], mcp = ["global", "project"], skills = [] }

# 示例:一个目录格式完全自定义的新 agent(声明式适配器)。
# 拷到 ~/.cellarer/adapters/<id>.toml 或 <project>/.cellarer/adapters/<id>.toml 即生效。
id = "acme-agent"
displayName = "ACME Agent"

[detect]
global = ["~/.acme"]
project = [".acme"]

[rules]
global = "~/.acme/AGENTS.md"
project = "{dir}/.acme/rules.md"
format = "markdown"

[mcp]
global = "~/.acme/mcp.json"
project = "{dir}/.acme/mcp.json"
format = "json"
servers_key = "mcpServers"
merge_strategy = "merge"

[skills]
global = "~/.acme/skills"
project = "{dir}/.acme/skills"
format = "dir"

capabilities = { rules = ["global", "project"], mcp = ["global", "project"], skills = ["global", "project"] }
